# Watching Ishai — deployed automatically by Cloudflare when this repo changes.
name = "ishai"
main = "src/index.js"          # built file (page + story engine in one); edit files in source/ and rebuild
compatibility_date = "2026-10-30"

[ai]
binding = "AI"

[[kv_namespaces]]
binding = "ISHAI"
id = "62778efab6dc475ba095345c03d64fc2"

# viewers' polls: one vote per browser per poll (see CLAUDE.md, "Viewers' polls")
[[d1_databases]]
binding = "DB"
database_name = "ishai-polls"
database_id = "7ec762a4-f13b-4409-a290-6b52a4ab29fe"

# Branch previews (`wrangler preview`, run by Cloudflare for branches other than main).
# They get their own KV and D1 so a preview never touches the live show. No crons in previews.
[previews.ai]
binding = "AI"

[[previews.kv_namespaces]]
binding = "ISHAI"
id = "4bb2e6e5243b4f1aa32feea93d4f6418"            # ishai-preview-state

[[previews.d1_databases]]
binding = "DB"
database_name = "ishai-polls-preview"
database_id = "9eca33ac-0274-41d4-a35c-1eb801beb846"

[triggers]
crons = ["*/2 * * * *"]   # every 2 minutes: a run makes a moment only once the last one is over (docs/PACING_PLAN.md)

# The ADMIN_KEY secret is set in the Cloudflare dashboard and is kept on every deploy.
