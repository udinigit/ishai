# Watching Ishai — deployed automatically by Cloudflare when this repo changes.
name = "ishai"
main = "src/index.js"          # built file (page + story engine in one); edit files in source/ and rebuild
compatibility_date = "2026-10-30"

[ai]
binding = "AI"

[[kv_namespaces]]
binding = "ISHAI"
id = "62778efab6dc475ba095345c03d64fc2"

[triggers]
crons = ["*/6 * * * *"]

# The ADMIN_KEY secret is set in the Cloudflare dashboard and is kept on every deploy.
