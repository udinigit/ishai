<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Watching Ishai</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#050705; --phos:#4dff7a; --phos-dim:#2a9a4c; --phos-faint:#123d20;
    --amber:#ffb84d; --red:#ff3b3b;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--phos);font-family:'VT323',ui-monospace,Menlo,monospace}
  body{min-height:100vh;display:flex;justify-content:center;padding:16px}
  .wrap{width:100%;max-width:760px;display:flex;flex-direction:column;gap:10px}
  .title{display:flex;justify-content:space-between;align-items:baseline;padding:0 4px;
    font-size:clamp(22px,5.5vw,32px);letter-spacing:1px;text-shadow:0 0 8px rgba(77,255,122,.45)}
  .title small{font-size:.55em;color:var(--phos-dim)}
  .cam{position:relative;border:2px solid var(--phos-faint);border-radius:10px;overflow:hidden;background:#000;
    box-shadow:0 0 34px rgba(77,255,122,.08)}
  canvas{display:block;width:100%;height:auto;image-rendering:pixelated;image-rendering:crisp-edges;animation:flicker 6s infinite}
  @keyframes flicker{0%,100%{filter:brightness(1)}48%{filter:brightness(1)}49%{filter:brightness(.92)}50%{filter:brightness(1.04)}51%{filter:brightness(1)}}
  .cam::after{content:"";position:absolute;inset:0;pointer-events:none;
    background:
      repeating-linear-gradient(to bottom,rgba(0,0,0,.20) 0,rgba(0,0,0,.20) 1px,transparent 1px,transparent 3px),
      radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.6) 100%)}
  .hud{position:absolute;left:0;right:0;padding:6px 12px;display:flex;justify-content:space-between;z-index:2;
    font-size:clamp(14px,3.8vw,22px);color:#eaffea;pointer-events:none;
    text-shadow:0 0 3px #000,0 0 6px rgba(0,0,0,.9)}
  .hud.top{top:0}.hud.bot{bottom:0}
  .rec{color:#ffdede}
  .dot{display:inline-block;width:.55em;height:.55em;border-radius:50%;background:var(--red);margin-right:.35em;
    box-shadow:0 0 6px var(--red);animation:blink 1.2s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  .nosig{position:absolute;inset:0;display:none;align-items:center;justify-content:center;z-index:2;pointer-events:none;
    font-size:clamp(18px,5vw,30px);color:#eaffea;text-shadow:0 0 4px #000}
  .nosig span{background:rgba(0,0,0,.55);padding:2px 10px}
  .status{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:clamp(15px,3.8vw,20px);color:var(--phos-dim);padding:0 4px}
  .status b{color:var(--phos);font-weight:normal}
  .term{border:2px solid var(--phos-faint);border-radius:10px;background:#020502;padding:12px 14px;
    height:min(42vh,360px);overflow-y:auto;font-size:clamp(18px,4.6vw,23px);line-height:1.15;
    text-shadow:0 0 6px rgba(77,255,122,.45);scrollbar-color:var(--phos-faint) transparent}
  .line{margin:0 0 9px}
  .line .ts{color:var(--phos-dim)}
  .line.old{opacity:.75}
  .cursor{display:inline-block;width:.55em;height:1em;background:var(--phos);vertical-align:-.15em;animation:blink 1s steps(1) infinite}
  .warn{color:var(--amber)}
  .foot{font-size:15px;color:var(--phos-dim);padding:0 4px;opacity:.8}
  .line.say{margin:-4px 0 9px 1.2em}
  .talk{display:flex;flex-direction:column;gap:10px}
  .say{position:absolute;z-index:4;pointer-events:none;transform:translate(-50%,-100%);max-width:62%;
    background:#f7f7f2;color:#151515;border:2px solid #151515;border-radius:8px;padding:2px 7px 3px;
    font-size:clamp(14px,3.7vw,20px);line-height:1.1;text-shadow:none;box-shadow:0 2px 0 rgba(0,0,0,.35)}
  .say::after{content:"";position:absolute;left:var(--tail,50%);bottom:-8px;margin-left:-6px;border:6px solid transparent;border-top-color:#151515;border-bottom:0}
  .say b{font-weight:normal;margin-right:5px;font-size:.85em;letter-spacing:.5px}
  .say.edge::after{display:none}
  .caption{position:absolute;left:8px;right:8px;bottom:34px;z-index:3;pointer-events:none;text-align:center;
    font-size:clamp(15px,4vw,22px);line-height:1.15;color:#fff;text-shadow:0 0 3px #000,0 0 6px #000}
  .caption span{background:rgba(0,0,0,.6);padding:1px 8px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
  /* the hosts' booth: newest line at the bottom, scrolls itself, viewers can't scroll back */
  .booth{display:flex;flex-direction:column;gap:6px;height:clamp(118px,24vh,170px);overflow:hidden;
    border:2px solid var(--phos-faint);border-radius:10px;padding:8px;background:#020502;touch-action:none;overscroll-behavior:contain}
  .booth .head{color:var(--red);font-size:.8em;letter-spacing:2px;flex:none}
  .host{display:grid;grid-template-columns:30px 1fr;gap:8px;align-items:start;border:1px dashed var(--phos-faint);border-radius:8px;padding:5px 8px;background:#020502;flex:none;opacity:.7}
  .host:last-child{opacity:1}
  .host canvas{width:30px;height:30px;image-rendering:pixelated;animation:none;background:#0b120b;border:1px solid var(--phos-faint);border-radius:6px}
  .host .hn{font-size:clamp(14px,3.6vw,18px);letter-spacing:1px}
  .host .hn span{color:var(--red);font-size:.8em}
  .host .hl{color:#eaffea;text-shadow:none;font-size:clamp(15px,3.9vw,19px);line-height:1.1}
  .host.live{border-style:solid;border-color:var(--phos-dim)}
  .host.ad{border-color:#6b5a1a;background:rgba(255,211,106,.06)}
  .host.ad .hn span::after{content:" · TOTALLY NOT AN AD";color:#ffd36a}
  .msg.host{background:rgba(77,255,122,.05);border:1px dashed var(--phos-faint);border-radius:8px;padding:6px}
  .msg.host .who::after{content:" · ON AIR";color:var(--red);font-size:.8em}
  .msg.host.ad .who::after{content:" · ON AIR · TOTALLY NOT AN AD";color:#ffd36a}
  .msg.host.ad{border-color:#6b5a1a;background:rgba(255,211,106,.06)}
  .talk .empty{color:var(--phos-dim);font-size:.85em}
  .msg{display:grid;grid-template-columns:40px 1fr;gap:10px;align-items:start}
  .msg canvas{width:40px;height:40px;image-rendering:pixelated;animation:none;background:#0b120b;border:1px solid var(--phos-faint);border-radius:6px}
  .msg .who{font-size:.85em;letter-spacing:1px}
  .msg .who small{color:var(--phos-dim);font-size:.8em;margin-left:6px}
  .msg .said{color:#eaffea;text-shadow:none;display:inline}
  .scene{color:var(--phos-dim);font-size:.8em;text-align:center;letter-spacing:2px;margin-top:4px}
  .tabs{display:flex;gap:8px;margin-bottom:-4px}
  .tabs button{font:inherit;font-size:clamp(17px,4.2vw,21px);background:transparent;color:var(--phos-dim);
    border:2px solid var(--phos-faint);border-bottom:none;border-radius:8px 8px 0 0;padding:2px 14px;cursor:pointer}
  .tabs button.on{color:var(--phos);background:#020502;text-shadow:0 0 6px rgba(77,255,122,.45)}
  .tabs button:focus-visible{outline:2px solid var(--phos);outline-offset:2px}
  .cast{display:flex;flex-direction:column;gap:12px}
  .card{display:grid;grid-template-columns:56px 1fr;gap:12px;align-items:start;padding-bottom:12px;border-bottom:1px dashed var(--phos-faint)}
  .card:last-child{border-bottom:none}
  .card canvas{width:56px;height:auto;image-rendering:pixelated;animation:none;background:#0b120b;border:1px solid var(--phos-faint);border-radius:4px}
  .card .nm{font-size:1.15em}
  .card .meta{color:var(--phos-dim);font-size:.85em;line-height:1.1}
  .card .mem{font-size:.9em;margin-top:3px}
  .card .rel{font-size:.85em;letter-spacing:1px}
  [hidden]{display:none !important}
  .snd{font:inherit;font-size:clamp(15px,3.8vw,20px);background:transparent;color:var(--phos);border:1px solid var(--phos-faint);
    border-radius:6px;padding:0 10px;cursor:pointer;margin-left:auto}
  .snd:focus-visible{outline:2px solid var(--phos);outline-offset:2px}
</style>
</head>
<body>
<div class="wrap">
  <div class="title"><span>&gt; WATCHING_ISHAI</span><small id="day">DAY --</small></div>

  <div class="cam">
    <div class="hud top"><span class="rec"><span class="dot"></span>REC <span id="cam">CAM-01</span></span><span id="clock">--:--:--</span></div>
    <canvas id="scene" width="192" height="108"></canvas>

    <div class="say" id="say" hidden><b id="sayWho"></b><span id="sayText"></span></div>
    <div class="nosig" id="nosig"><span id="nosigText">[ SUBJECT NOT IN FRAME ]</span></div>
    <div class="hud bot"><span id="place">ISHAI // APARTMENT</span><span id="hudAction">--</span></div>
  </div>

  <div class="status">
    <span>STATUS: <b id="stAction">--</b></span>
    <span>FEED: <b id="stLink">CONNECTING…</b></span>
    <span id="stNext"></span>
    <button id="snd" class="snd" title="Tap to change sound">SOUND: OFF</button>
  </div>

  <div class="booth" id="booth" aria-live="polite"></div>
  <div class="tabs" role="tablist">
    <button id="tabTalk" class="on" role="tab" aria-selected="true">CONVERSATIONS</button>
    <button id="tabCast" role="tab" aria-selected="false">CAST</button>
    <button id="tabFeed" role="tab" aria-selected="false" hidden>NARRATION (DEV)</button>
  </div>
  <div class="term talk" id="talk" aria-live="polite"><div class="empty" id="talkEmpty">Quiet right now. When someone talks in this scene, it appears here.</div></div>
  <div class="term" id="term" hidden></div>
  <div class="term cast" id="castPanel" hidden></div>
  <div class="foot">Story written by AI. Ishai is fictional.</div>
</div>

<script>
(() => {
  // ================= config =================
  const API = '/api/state';
  const BUILD = '__BUILD__'; // replaced at build time; compared with the server's to auto-update
  const POLL_MS = 45000;
  const TZ = 'Asia/Jerusalem';
  const W = 192, H = 108;

  // Must match the Worker
  const LOCATIONS = {
    apartment: ['sleeping','waking','idle','walking','working','gaming','eating','drinking','cooking','reading','exercising','watching','listening','bathroom','showering','talking','phoning'],
    corridor:  ['walking','idle','talking','phoning'],
    street:    ['walking','idle','talking','eating','drinking','phoning'],
    park:      ['walking','idle','talking','reading','eating','drinking','exercising','phoning'],
    cafe:      ['idle','eating','drinking','working','reading','talking','phoning'],
    offscreen: ['away'],
    bathroom:  ['bathroom','showering'] // page-only room: the story says apartment/bathroom|showering
  };
  let UNLOCKED = new Set(); // items the story has brought in (tv, radio)
  const BATH = new Set(['bathroom','showering']); // he disappears behind the bathroom door
  let WORLD = null; // real weather / Shabbat from the Worker
  let DREAM = []; // today's highlights {t, loc, a, w}: replayed in a thought bubble while he sleeps
  let DREAMING = false; // true while a dream picture is being drawn off screen
  let SPEAKING = null; // who is talking right now (drives the speech bubbles on camera)
  function setSpeaking(w){ SPEAKING = w; }
  const LABEL = {phoning:'ON THE PHONE',drinking:'DRINKING',bathroom:'BATHROOM',showering:'SHOWER',watching:'WATCHING TV',listening:'RADIO ON',sleeping:'SLEEPING',waking:'WAKING UP',idle:'IDLE',walking:'WALKING',working:'WORKING',gaming:'GAMING',
    eating:'EATING',cooking:'COOKING',reading:'READING',exercising:'EXERCISING',talking:'TALKING',away:'UNKNOWN'};

  const params = new URLSearchParams(location.search);
  const forceHour = params.has('hour') ? parseFloat(params.get('hour')) : null;
  const forceLoc = LOCATIONS[params.get('loc')] ? params.get('loc') : null;
  const forcePose = params.get('pose');

  const cv = document.getElementById('scene');
  const ctx = cv.getContext('2d');
  const $ = id => document.getElementById(id);

  // ================= time =================
  const fmtClock = new Intl.DateTimeFormat('en-GB',{timeZone:TZ,hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});
  const fmtHM = new Intl.DateTimeFormat('en-GB',{timeZone:TZ,hour:'2-digit',minute:'2-digit',hour12:false});
  function hourNow(){
    if (forceHour !== null) return forceHour;
    const [h,m] = fmtHM.format(new Date()).split(':').map(Number);
    return (h % 24) + m/60;
  }
  const isNight = hf => hf < 6 || hf >= 19.5;

  // ================= palette & primitives =================
  const C = {
    wall:'#2c3a4d', wallDark:'#253244', trim:'#1d2736', floor:'#5a3f2b', floorLine:'#4a3322',
    wood:'#7a5534', woodDark:'#5e4027', woodLight:'#9a7048',
    blanket:'#b84a4a', blanketDark:'#943a3a', pillow:'#ece6d6', sheet:'#d8d2c0',
    hair:'#2b1d14', skin:'#e0ac7e', skinShade:'#c18657', eye:'#161616', mouth:'#7a3a32',
    shirt:'#2f8f83', shirtShade:'#24706a', pants:'#34405a', shoe:'#161616',
    chair:'#3a3a46', arm:'#4f6b3a', armDark:'#41592f', armLight:'#5d7a46',
    metal:'#aab2bc', metalDark:'#7d858f', counter:'#8c7b6a', top:'#d6d0c4', island:'#5f7180',
    fridge:'#dfe4e8', door:'#5c4330', doorFrame:'#44311f', gold:'#d4af37', rug:'#7a3b52', rugLight:'#8f4a63',
    frame:'#d9d4c7', pot:'#3e3e3e', leaf:'#3fa34d', leafDark:'#2f7d3a', terracotta:'#a0522d'
  };
  let g = ctx; // current drawing target (scene or a cast portrait)
  const R = (x,y,w,h,c) => { g.fillStyle = c; g.fillRect(Math.round(x),Math.round(y),w,h); };
  function alpha(a, fn){ g.globalAlpha = a; fn(); g.globalAlpha = 1; }
  function line(x0,y0,x1,y1,c){
    const dx=Math.abs(x1-x0), dy=-Math.abs(y1-y0), sx=x0<x1?1:-1, sy=y0<y1?1:-1; let e=dx+dy;
    for(;;){ R(x0,y0,1,1,c); if(x0===x1&&y0===y1)break; const e2=2*e; if(e2>=dy){e+=dy;x0+=sx;} if(e2<=dx){e+=dx;y0+=sy;} }
  }
  function skyColor(hf){
    if (hf < 5 || hf >= 20) return {c:'#0b1530', night:true};
    if (hf < 6.5) return {c:'#c9777a', dawn:true};
    if (hf < 17.5) return {c:'#7ec8f0'};
    return {c:'#b35f78', dawn:true};
  }
  function isShabbatEve(){
    if (params.has('shabbat')) return true;
    const sh = WORLD && WORLD.shabbat; if (!sh || !sh.start) return false;
    const n = Date.now(); return n > sh.start - 20*60000 && n < sh.start + 5*3600000;
  }
  function weatherLabel(){
    const w = WORLD && WORLD.weather; if (!w) return '';
    return `TLV ${w.temp}°C ${String(w.desc).toUpperCase()}` + (isShabbatEve() ? ' · SHABBAT SHALOM' : '');
  }
  const rainy = () => !!(WORLD && WORLD.weather && WORLD.weather.rain);
  const cloudy = () => !!(WORLD && WORLD.weather && WORLD.weather.cloudy);
  function drawRain(x,y,w,h,t,n=40){
    for (let i=0;i<n;i++){ const rx = x + ((i*37 + Math.floor(t/30)) % w), ry = y + ((i*53 + Math.floor(t/12)) % h);
      R(rx,ry,1,2,'#cfe0ff'); }
  }
  function drawSky(x,y,w,h,hf,t){
    const s = skyColor(hf);
    if (cloudy() && !s.night){ s.c = s.dawn ? '#8f7a86' : '#9fb0bf'; s.dawn = false; s.overcast = true; }
    R(x,y,w,h,s.c);
    g.save(); g.beginPath(); g.rect(x,y,w,h); g.clip();
    if (s.overcast){ for (let i=0;i<4;i++){ const cx = x + ((i*41 + Math.floor(t/400)) % (w+20)) - 10; R(cx, y+2+i*5%Math.max(1,h-6), 14, 3, '#c8d2db'); } }
    if (rainy()) { drawRain(x,y,w,h,t, Math.max(6, Math.floor(w*h/60))); if (!s.night) s.dawn = false; s.noSun = true; }
    g.restore();
    if (s.night && !cloudy()){
      for (let i=0;i<14;i++){ const sx=x+((i*37)%w), sy=y+((i*23)%Math.max(1,h-2));
        if ((Math.floor(t/900)+i)%5) R(sx,sy,1,1,'#ffffff'); }
    } else if (s.dawn){ R(x,y+h-5,w,5,'#e8a56a'); }
    return s;
  }
  function drawClock(x,y){
    R(x+2,y,5,1,'#e8e4d8'); R(x+1,y+1,7,7,'#e8e4d8'); R(x,y+2,9,5,'#e8e4d8'); R(x+2,y+8,5,1,'#e8e4d8');
    const hf = hourNow(); const hA=((hf%12)/12)*Math.PI*2, mA=(hf%1)*Math.PI*2;
    line(x+4,y+4, x+4+Math.round(Math.sin(hA)*2), y+4-Math.round(Math.cos(hA)*2), '#222');
    line(x+4,y+4, x+4+Math.round(Math.sin(mA)*3), y+4-Math.round(Math.cos(mA)*3), '#c23b3b');
  }
  // ---- Cooola: the show's (fake) sponsor. Purple + lime, blocky letters, a lightning bolt ----
  const COOOLA = {bg:'#5b2a86', fg:'#b6ff3b', bolt:'#ffd84a', dark:'#3d1a5e'};
  const FONT = {C:['111','100','100','100','111'], O:['111','101','101','101','111'], L:['100','100','100','100','111'], A:['010','101','111','101','101']};
  function word(txt, x, y, c){ [...txt].forEach((ch,k)=>{ const gl = FONT[ch]; if (gl) gl.forEach((row,j)=>[...row].forEach((b,i)=>{ if (b==='1') R(x+k*4+i, y+j, 1, 1, c); })); }); }
  function bolt(x,y,c){ R(x+1,y,2,1,c); R(x,y+1,2,1,c); R(x,y+2,3,1,c); R(x+1,y+3,2,1,c); R(x+1,y+4,1,1,c); }
  // a sign: w >= 29, h >= 9
  function cooolaSign(x,y,w,h,glow){
    if (glow) alpha(.18,()=>R(x-2,y-2,w+4,h+4,COOOLA.fg));
    R(x,y,w,h,COOOLA.bg); R(x,y,w,1,COOOLA.fg); R(x,y+h-1,w,1,COOOLA.fg);
    const tx = x + Math.floor((w-27)/2); word('COOOLA', tx, y+Math.floor((h-5)/2), COOOLA.fg); bolt(tx+24, y+Math.floor((h-5)/2), COOOLA.bolt);
  }
  function cooolaCan(x,y){ R(x,y,3,5,COOOLA.bg); R(x,y+2,3,1,COOOLA.fg); R(x,y,3,1,'#c9ced4'); }
  function zee(x,y,c){ R(x,y,3,1,c); R(x+1,y+1,1,1,c); R(x,y+2,3,1,c); }
  function bubble(){} // speech is shown in a real bubble above the speaker (see showSay)
  // where each visible character's head is this frame (for placing speech bubbles)
  let HEADS = {};
  const markHead = (id, x, y) => { if (id && !DREAMING) HEADS[id] = {x: x + 5, y}; };

  // ================= Ishai (and NPCs) =================
  // figure box: 10 wide x 22 tall, (x,y) = top-left
  function head(x,y,o={}){
    R(x+2,y,6,2,C.hair); R(x+1,y+1,8,2,C.hair);
    R(x+2,y+2,6,6,C.skin); R(x+2,y+2,6,1,C.hair);
    R(x+1,y+3,1,2,C.hair); R(x+8,y+3,1,2,C.hair);
    R(x+1,y+5,1,1,C.skinShade); R(x+8,y+5,1,1,C.skinShade);
    const lx = o.look||0;
    if (o.closed){ R(x+3+lx,y+4,2,1,C.skinShade); R(x+5+lx,y+4,2,1,C.skinShade); }
    else { R(x+3+lx,y+4,1,1,C.eye); R(x+6+lx,y+4,1,1,C.eye); }
    if (o.yawn) R(x+4,y+6,2,2,C.mouth);
    else if (o.talk) R(x+4,y+6,2,1,C.mouth);
    else R(x+4,y+6,2,1,C.skinShade);
    R(x+4,y+8,2,1,C.skinShade);
  }
  function torso(x,y){ R(x+2,y+9,6,7,C.shirt); R(x+2,y+15,6,1,C.shirtShade); R(x+4,y+9,2,1,C.shirtShade); }
  function armsDown(x,y,sw=0){
    R(x+1,y+9+sw,1,4,C.shirt); R(x+1,y+13+sw,1,2,C.skin);
    R(x+8,y+9-sw,1,4,C.shirt); R(x+8,y+13-sw,1,2,C.skin);
  }
  function armsUp(x,y){
    R(x+1,y+9,1,1,C.shirt); R(x+8,y+9,1,1,C.shirt);
    R(x,y+5,1,4,C.shirt); R(x+9,y+5,1,4,C.shirt); R(x,y+2,1,3,C.skin); R(x+9,y+2,1,3,C.skin);
  }
  function armsFront(x,y){ R(x+1,y+9,1,3,C.shirt); R(x+8,y+9,1,3,C.shirt); }
  function legs(x,y,mode=0){
    R(x+2,y+16,6,2,C.pants);
    if (mode==='apart'){ R(x+1,y+18,2,3,C.pants); R(x+7,y+18,2,3,C.pants); R(x,y+21,3,1,C.shoe); R(x+7,y+21,3,1,C.shoe); }

    ['park','drinking',null,'He finishes a whole bottle of water in one go and looks proud of it.',[]],
    ['cafe','talking','dana','At the counter, Dana hands him a cup with a tiny basil leaf drawn on it.',[['dana','Same as always.'],['ishai','Is that... Moshe?']],null,
      [['zohar','She draws on his cup. He thinks it is about the plant. Men.'],['oren','I will allow it. Moshe deserves fans.']]],
    ['corridor','talking','avi','Avi carries his cousin\'s old TV up the stairs while Mrs. Levi supervises from her door.',[['avi','A home without a TV is a box, champion.']],'tv'],
    ['apartment','watching',null,'First night with a TV. Ishai watches a cooking show about pickles and burns his own dinner.',[]],
    ['offscreen','away',null,'He leaves toward the bus station. Destination unknown. No camera there.',[]],
    ['apartment','listening',null,'Mrs. Levi\'s old radio crackles to life. Some station plays 8-bit love songs. He pretends not to enjoy it.',[],'radio'],
    ['apartment','sleeping',null,'Lights out. Ishai falls asleep mid-thought about the basil leaf.',[]]
  ];
  let demoMode = false, demoIdx = +params.get('demoStart') || 0;
  let demoStarted = false;
  function demoTick(){
    if (demoIdx % DEMO.length === 0) UNLOCKED = new Set();
    const [loc,a,w,text,lines,unlocks,comm] = DEMO[demoIdx % DEMO.length];
    if (w){ const c = DEMO_CAST.find(x=>x.id===w); if (c){ c.lastSeen = Date.now(); c.scenes = (c.scenes||0)+1; } setCast(DEMO_CAST.map(c=>({...c}))); }
    ingest([{id:'demo-'+demoIdx, t:Date.now(), location:loc, action:a, with:w, text, unlocks: unlocks||null, lines:lines.map(([who,say])=>({who,say})), commentary:(comm||[]).map(([who,say])=>({who,say}))}], !demoStarted); demoStarted = true; demoIdx++;
  }
  function startDemo(){
    if (demoMode) return; demoMode = true;
    $('stLink').innerHTML = '<span class="warn">DEMO (no Worker connected)</span>';
    NOTES = 'Dana keeps drawing basil leaves on his cups. Mrs. Levi suspects a midnight party.';
    setCast(DEMO_CAST);
    $('day').textContent = 'DAY 1'; demoTick(); setInterval(demoTick, +params.get('demoMs') || 18000);
  }

  let updating = false;
  function offerUpdate(){
    if (updating) return; updating = true;
    // never reload more than once every 2 minutes (in case old and new versions overlap briefly)
    try { const last = +sessionStorage.getItem('ishaiReload') || 0; if (Date.now() - last < 120000) return; sessionStorage.setItem('ishaiReload', Date.now()); } catch(e){}
    // reload once the current line has finished typing (sound resumes on the next tap)
    const go = () => { if (typing || queue.length) return setTimeout(go, 1500); location.reload(); };
    setTimeout(go, 1500);
  }
  let loaded = false, fails = 0;
  async function poll(){
    let s;
    try{
      let key = ''; try { key = localStorage.getItem('ishaiKey') || ''; } catch(e){}
      const r = await fetch(API, {cache:'no-store', headers: key ? {'x-admin-key': key} : {}});
      if (!r.ok) throw new Error('server ' + r.status);
      s = await r.json();
      if (!s || !Array.isArray(s.events)) throw new Error(s && s.error ? s.error : 'bad data');
      fails = 0;
    } catch(e){
      fails++;
      if (!loaded) startDemo();
      else if (fails >= 2) $('stLink').innerHTML = '<span class="warn">SIGNAL LOST (' + String(e.message).slice(0,40).replace(/[<>&]/g,'') + '), RETRYING…</span>';
      return;
    }
    try{
      $('stLink').textContent = s.delayMin ? `LIVE (${s.delayMin} MIN DELAY)` : 'LIVE';
      $('day').textContent = 'DAY ' + (s.day || 1);
      if (s.build && !BUILD.startsWith('__') && s.build !== BUILD) offerUpdate();
      if (s.dev) enableDev();
      if (!loaded) TALK_HISTORY = s.talk || [];
      NOTES = s.notes || ''; setCast(s.cast);
      if (s.world) { WORLD = s.world; $('stNext').textContent = weatherLabel(); }
      if (Array.isArray(s.dream)) DREAM = s.dream;
      // items appear when the moment that brings them is shown, not before (broadcast delay)
      const future = new Set(s.events.filter(e=>e.unlocks && !shown.has(e.id) && e.t > Date.now()).map(e=>e.unlocks));
      (s.unlocked||[]).forEach(u=>{ if (!future.has(u)) UNLOCKED.add(u); });
      ingest(s.events, !loaded); loaded = true;
    } catch(e){ console.error('feed render error', e); loaded = true; }
  }

  if (params.has('rain') || params.has('cloudy')) WORLD = {weather:{temp:19, desc: params.has('rain') ? 'light rain' : 'overcast', rain: params.has('rain'), cloudy: true}};
  if (WORLD) $('stNext').textContent = weatherLabel();
  boothInit();
  if (params.get('unlock')) params.get('unlock').split(',').forEach(u=>UNLOCKED.add(u));
  if (forceLoc){ setCast(DEMO_CAST); setState(forceLoc, forcePose || 'idle', true, params.get('with')); }
  else setState('apartment','sleeping',true);
  requestAnimationFrame(loop);
  if (forceLoc) { $('stLink').textContent = 'PREVIEW'; if (params.has('cast')) showTab('cast'); }
  else if (location.protocol === 'file:' || params.has('demo')) { if (params.has('dev')) enableDev(); startDemo(); }
  else { poll(); setInterval(()=>{ if (!demoMode) poll(); }, POLL_MS); }
})();
</script>
</body>
</html>
